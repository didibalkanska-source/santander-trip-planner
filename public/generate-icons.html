<!DOCTYPE html>
<html>
<body style="background:#222;color:white;font-family:sans-serif;padding:20px">
<h2>Japan Trip - Icon Generator</h2>
<p>Click each button to download the icon:</p>
<button onclick="download('c192','icon-192.png')">Download icon-192.png</button>
<button onclick="download('c512','icon-512.png')">Download icon-512.png</button>
<br><br>
<canvas id="c192" width="192" height="192" style="border:1px solid #555;margin:8px"></canvas>
<canvas id="c512" width="512" height="512" style="border:1px solid #555;margin:8px;width:192px;height:192px"></canvas>

<script>
function drawIcon(id, size) {
  const c = document.getElementById(id);
  const ctx = c.getContext('2d');

  // Background - soft pink
  ctx.fillStyle = '#ffb7c5';
  ctx.beginPath();
  const r = size * 0.18;
  ctx.roundRect(0, 0, size, size, r);
  ctx.fill();

  // Sakura emoji centered
  ctx.font = `${size * 0.58}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🌸', size / 2, size / 2);
}

drawIcon('c192', 192);
drawIcon('c512', 512);

function download(id, filename) {
  const c = document.getElementById(id);
  const a = document.createElement('a');
  a.download = filename;
  a.href = c.toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>
